name: Validate Timson's English Lessons

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Validate shared assets and protected lesson shells
        run: |
          set -e
          test -f index.html
          test -f design-system.css
          test -f lesson-loader.js
          test -f theme-controller.js
          test -f color-1.css
          test -f color-2.css
          test -f color-3.css
          grep -q 'design-system.css?v=20261114-deployfix1' index.html
          grep -q 'theme-controller.js?v=20261114-deployfix1' index.html
          grep -q 'design-system.css?v=20261114-deployfix1' lesson-loader.js
          grep -q 'theme-controller.js?v=20261114-deployfix1' lesson-loader.js
          grep -q 'font-family: "Times New Roman", Times, serif !important;' design-system.css
          grep -q 'applyColor' theme-controller.js
          grep -q 'applyDark' theme-controller.js
          python - <<'PY'
          from pathlib import Path
          version = "20261114-deployfix1"
          shells = sorted(
              p for level in ("Beginner-*", "Elementary-*")
              for p in Path(".").glob(f"{level}/*/index.html")
          )
          if len(shells) != 71:
              raise SystemExit(f"Expected 71 protected lesson shells; found {len(shells)}")
          for path in shells:
              html = path.read_text(encoding="utf-8")
              if f"lesson-loader.js?v={version}" not in html:
                  raise SystemExit(f"Stale lesson-loader URL in {path}")
          print(f"Validated homepage, shared theme assets and all {len(shells)} protected lesson shells.")
          PY
