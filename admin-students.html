<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin's Students | Timson's English Lessons</title><link rel="stylesheet" href="roles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="admin-students.js?v=20261027"></script><style>.tools{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.tools input,.tools select,td input,td select,td textarea{padding:9px;border:1px solid #ccd3df;border-radius:8px;max-width:100%}.student-list{display:grid;gap:14px}.student-item{border:1px solid #dce2ed;border-radius:14px;padding:18px;background:white}.student-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.skill-form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:end;margin-top:14px}.skill-form label{display:grid;gap:5px;font-size:13px}.skill-form button{align-self:end}@media(max-width:760px){.skill-form{grid-template-columns:1fr 1fr}}@media(max-width:460px){.skill-form{grid-template-columns:1fr}}.muted{color:#667085}.history{margin-top:12px;font-size:14px}</style></head><body data-required-role="admin"><header class="topbar"><a class="brand" href="index.html">Timson's <span>English Lessons</span></a><div class="top-actions"><span id="session-email" class="session-email"></span><button id="logout-btn" class="button button-light hidden">Log out</button></div></header><main class="page-shell"><section class="welcome"><div><p class="eyebrow">ADMINISTRATION</p><h1>Admin's Students</h1><p>Manage student profiles, teacher connections and skill assessments.</p></div><span class="role-chip">Administrator</span></section><section id="auth-panel" class="panel auth-panel"><h2>Administrator sign in</h2><form id="login-form"><label for="email">Email</label><input id="email" name="email" type="email" required><label for="password">Password</label><input id="password" name="password" type="password" required><button class="button button-primary" type="submit">Sign in</button><p id="auth-message" class="message"></p></form></section><section id="dashboard-panel" class="hidden"><section class="panel"><div class="section-heading"><div><h2>Student directory</h2><p id="summary" class="muted">Loading students…</p></div><button id="refresh" class="button button-light">Refresh list</button></div><div class="tools"><input id="search" type="search" placeholder="Search name, email, phone"><select id="teacher-filter"><option value="">All teacher assignments</option><option value="unassigned">Unassigned students</option></select></div><p id="status" class="message" role="status"></p><div id="students" class="student-list"></div></section><p><a class="back-link" href="admin.html">← Back to Admin Dashboard</a></p></section></main><footer>© <span data-year></span> Timson's English Lessons</footer></body></html>
